<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Oasis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HOME SCREEN -->
    <div id="home-screen" class="phone-screen">
        <header>
            <img src="logo.png" alt="Logo">
            <nav>
                <button id="btn-home" class="menu">Home</button>
                <button id="btn-notes" class="menu">Notes</button>
                <button class="menu">Settings</button>
            </nav>
        </header>
        
        <textarea id="note-input" placeholder="type what's on your mind..." cols="43" rows="10"></textarea>
        <button id="btn-save" class="save-btn"><span>💾</span> save changes</button>
    </div>

    <!-- NOTES SCREEN (Hidden by default) -->
    <div id="notes-screen" class="phone-screen" style="display: none;">
        <h2>Your Notes</h2>
        
        <!-- This is where the notes will appear -->
        <div id="notes-list"></div>
        
        <button id="btn-back" class="menu">Back to Home</button>
    </div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</body>
</html>
